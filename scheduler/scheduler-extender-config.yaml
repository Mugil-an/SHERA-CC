apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
clientConnection:
  kubeconfig: /etc/kubernetes/scheduler.conf
leaderElection:
  leaderElect: true
extenders:
  - urlPrefix: "http://127.0.0.1:8888"
    filterVerb: "filter"
    prioritizeVerb: "prioritize"
    weight: 1
    enableNodeCache: false
    httpTimeout: 5s
