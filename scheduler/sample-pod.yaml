apiVersion: v1
kind: Pod
metadata:
  name: shap-scheduled-demo-pod
  namespace: workloads
  labels:
    app.kubernetes.io/part-of: "shap-workloads"
    workload_type: "cpu"
spec:
  restartPolicy: Never
  containers:
    - name: stress
      image: shap-workload:local
      imagePullPolicy: IfNotPresent
      command: ["stress-ng"]
      args: ["--cpu", "1", "--timeout", "30s"]
      resources:
        requests:
          cpu: "500m"
          memory: "128Mi"
        limits:
          cpu: "1000m"
          memory: "256Mi"
