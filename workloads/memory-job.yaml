
apiVersion: batch/v1
kind: Job
metadata:
  name: memory-test
  namespace: workloads
  labels:
    experiment: memory
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        experiment: memory
    spec:
      restartPolicy: Never
      containers:
        - name: stress
          image: shap-workload:local
          imagePullPolicy: IfNotPresent
          command: ["stress-ng"]
          args:
            - "--vm"
            - "1"
            - "--vm-bytes"
            - "64M"
            - "--timeout"
            - "120s"
            - "--metrics-brief"
          resources:
            requests:
              cpu: "100m"
              memory: "96Mi"
            limits:
              cpu: "300m"
              memory: "192Mi"
